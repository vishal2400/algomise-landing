<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!-- Static form so Netlify can detect it at build time. The real UI is the
         React modal in app/components/ContactForm.tsx, which POSTs here. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <select name="topic">
        <option>AI project / consulting</option>
        <option>Partnership</option>
        <option>App support — CoinJeeto / CashBoo</option>
        <option>Careers</option>
        <option>Other</option>
      </select>
      <select name="budget">
        <option>Not sure yet</option>
        <option>Under ₹5L</option>
        <option>₹5L – ₹20L</option>
        <option>₹20L +</option>
      </select>
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
